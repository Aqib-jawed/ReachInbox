name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Test & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reachinbox
          POSTGRES_USER: reachinbox
          POSTGRES_PASSWORD: reachinbox_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reachinbox -d reachinbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://reachinbox:reachinbox_secret@localhost:5432/reachinbox?schema=public"
      REDIS_URL: "redis://localhost:6379"
      ELASTICSEARCH_ENABLED: "false"
      JWT_SECRET: "ci-test-jwt-secret-key-for-reachinbox"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Push database schema
        working-directory: apps/backend
        run: npx prisma db push --accept-data-loss

      - name: Run Typecheck
        working-directory: apps/backend
        run: npm run typecheck

      - name: Run Unit and Integration Tests
        working-directory: apps/backend
        run: npm test
